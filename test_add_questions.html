<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Sample Questions</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .test-section { margin: 20px 0; padding: 15px; border: 1px solid #ccc; }
        .success { background-color: #d4edda; border-color: #c3e6cb; }
        .error { background-color: #f8d7da; border-color: #f5c6cb; }
        button { padding: 10px 20px; margin: 5px; }
        pre { background-color: #f8f9fa; padding: 10px; overflow-x: auto; }
    </style>
</head>
<body>
    <h1>Add Sample Questions to Exam</h1>
    
    <div class="test-section">
        <h2>Add Questions to Java Fundamentals Exam (ID: 4)</h2>
        <button onclick="addSampleQuestions()">Add Sample Questions</button>
        <div id="result"></div>
    </div>

    <div class="test-section">
        <h2>Test Exam Start</h2>
        <button onclick="testExamStart()">Test Start Exam</button>
        <div id="startResult"></div>
    </div>

    <script>
        const API_BASE = 'http://localhost:8081';
        // Use a valid admin token - you may need to get this from your login
        const TOKEN = 'eyJhbGciOiJIUzI1NiJ9.eyJzdWIiOiJhZG1pbkBlcGF0aHNoYWxhLmNvbSIsInJvbGUiOiJBRE1JTiIsImV4cCI6MTc1NDQ4NjgwNiwiaWF0IjoxNzU0NDUwODA2fQ.example';

        async function apiCall(url, options = {}) {
            const config = {
                ...options,
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': `Bearer ${TOKEN}`,
                    ...options.headers,
                },
            };

            const response = await fetch(`${API_BASE}${url}`, config);
            
            if (!response.ok) {
                const errorData = await response.json().catch(() => ({ error: 'Network error' }));
                throw new Error(errorData.error || errorData.message || `HTTP ${response.status}: ${response.statusText}`);
            }

            return response.text();
        }

        async function addSampleQuestions() {
            const resultDiv = document.getElementById('result');
            resultDiv.innerHTML = '<p>Adding sample questions...</p>';
            
            try {
                const response = await apiCall('/api/admin/add-sample-questions/4', {
                    method: 'POST'
                });

                resultDiv.className = 'test-section success';
                resultDiv.innerHTML = `
                    <h3>✅ Questions Added Successfully!</h3>
                    <p><strong>Response:</strong> ${response}</p>
                `;
            } catch (error) {
                resultDiv.className = 'test-section error';
                resultDiv.innerHTML = `
                    <h3>❌ Error Adding Questions</h3>
                    <p><strong>Error:</strong> ${error.message}</p>
                `;
            }
        }

        async function testExamStart() {
            const resultDiv = document.getElementById('startResult');
            resultDiv.innerHTML = '<p>Testing exam start...</p>';
            
            try {
                const response = await apiCall('/api/student/exams/4/start', {
                    method: 'POST'
                });

                resultDiv.className = 'test-section success';
                resultDiv.innerHTML = `
                    <h3>✅ Exam Start Test Successful!</h3>
                    <p><strong>Response:</strong> ${response}</p>
                `;
            } catch (error) {
                resultDiv.className = 'test-section error';
                resultDiv.innerHTML = `
                    <h3>❌ Error Starting Exam</h3>
                    <p><strong>Error:</strong> ${error.message}</p>
                `;
            }
        }
    </script>
</body>
</html>
